version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medvault-db
    environment:
      POSTGRES_DB: medvaultdb
      POSTGRES_USER: medvault
      POSTGRES_PASSWORD: medvaultsecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvault -d medvaultdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medvault-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medvaultdb
      SPRING_DATASOURCE_USERNAME: medvault
      SPRING_DATASOURCE_PASSWORD: medvaultsecret
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      MEDVAULT_AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medvault-ai
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medvault-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
