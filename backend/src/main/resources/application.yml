server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: medvault-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medvaultdb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:7078}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

medvault:
  jwt:
    secret: ${JWT_SECRET:9a6f8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
